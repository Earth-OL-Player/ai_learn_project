<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">AI 学习路线图标</title>
  <desc id="desc">渐变背景中的学习路径、星光和 AI 字母，表示 AI 学习路线与资料。</desc>

  <!-- 使用清爽蓝紫渐变，保证浏览器标签页小尺寸也足够醒目。 -->
  <defs>
    <linearGradient id="iconBackground" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8" />
      <stop offset="0.52" stop-color="#6366f1" />
      <stop offset="1" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="routeLine" x1="17" y1="44" x2="48" y2="19" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e0f2fe" />
      <stop offset="1" stop-color="#ffffff" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1e1b4b" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- 圆角底色适配 Chrome、Edge 等标签页的浅色和深色主题。 -->
  <rect width="64" height="64" rx="18" fill="url(#iconBackground)" />
  <circle cx="49" cy="15" r="5" fill="#fef3c7" opacity="0.95" />
  <path d="M48.5 7.5v3.2M48.5 19.3v3.2M56 15h-3.2M44.2 15H41" stroke="#fff7ed" stroke-width="2" stroke-linecap="round" opacity="0.86" />

  <!-- 学习路线用节点连线表达，贴合站点“路线和资料”的定位。 -->
  <g filter="url(#softShadow)">
    <path d="M17 44c8-9 15-7 21-16 3.5-5.2 6.4-7.8 10-9" fill="none" stroke="url(#routeLine)" stroke-width="5" stroke-linecap="round" />
    <circle cx="17" cy="44" r="5.5" fill="#ecfeff" />
    <circle cx="35" cy="30" r="5" fill="#ecfeff" />
    <circle cx="48" cy="19" r="5.5" fill="#ecfeff" />
  </g>

  <!-- AI 字母强化识别，白色描边让 16x16 标签页尺寸依然清晰。 -->
  <text x="16" y="31" fill="#ffffff" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" font-weight="800" letter-spacing="-1">AI</text>
  <path d="M22 48h20" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.78" />
</svg>
