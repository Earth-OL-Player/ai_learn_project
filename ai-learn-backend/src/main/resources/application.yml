server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: ai-learn-backend
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://127.0.0.1:3306/ai_learn?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DATABASE_USERNAME:ai_learn_user}
    password: ${DATABASE_PASSWORD:请在本地环境变量中填写真实密码}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis:
  configuration:
    map-underscore-to-camel-case: true

app:
  jwt:
    secret: ${JWT_SECRET:请在本地环境变量中配置至少32字节JWT密钥占位符}
    expires-in-seconds: ${JWT_EXPIRES_IN_SECONDS:7200}
  ai-service:
    enabled: ${AI_SERVICE_ENABLED:false}
    base-url: ${AI_SERVICE_BASE_URL:http://127.0.0.1:8000}
    token: ${AI_SERVICE_TOKEN:AI_SERVICE_TOKEN占位符}
    timeout-seconds: ${AI_SERVICE_TIMEOUT_SECONDS:15}
    stream-executor:
      core-size: ${AI_STREAM_EXECUTOR_CORE_SIZE:8}
      max-size: ${AI_STREAM_EXECUTOR_MAX_SIZE:16}
      queue-capacity: ${AI_STREAM_EXECUTOR_QUEUE_CAPACITY:64}
      keep-alive-seconds: ${AI_STREAM_EXECUTOR_KEEP_ALIVE_SECONDS:60}
      await-termination-seconds: ${AI_STREAM_EXECUTOR_AWAIT_TERMINATION_SECONDS:5}
  model-authorization:
    url: ${MODEL_AUTHORIZATION_URL:}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    login-limit: ${RATE_LIMIT_LOGIN_LIMIT:10}
    login-window-seconds: ${RATE_LIMIT_LOGIN_WINDOW_SECONDS:60}
    register-limit: ${RATE_LIMIT_REGISTER_LIMIT:3}
    register-window-seconds: ${RATE_LIMIT_REGISTER_WINDOW_SECONDS:3600}
    like-limit: ${RATE_LIMIT_LIKE_LIMIT:30}
    like-window-seconds: ${RATE_LIMIT_LIKE_WINDOW_SECONDS:60}
    comment-limit: ${RATE_LIMIT_COMMENT_LIMIT:10}
    comment-window-seconds: ${RATE_LIMIT_COMMENT_WINDOW_SECONDS:60}
    csv-import-limit: ${RATE_LIMIT_CSV_IMPORT_LIMIT:3}
    csv-import-window-seconds: ${RATE_LIMIT_CSV_IMPORT_WINDOW_SECONDS:600}
    ai-request-limit: ${RATE_LIMIT_AI_REQUEST_LIMIT:8}
    ai-request-window-seconds: ${RATE_LIMIT_AI_REQUEST_WINDOW_SECONDS:60}
    ai-concurrent-limit: ${RATE_LIMIT_AI_CONCURRENT_LIMIT:1}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics

logging:
  pattern:
    # 控制台日志显式读取 MDC 中的 traceId，便于按请求链路排查问题。
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%logger{36}] traceId=%X{traceId} [%thread] %msg%n%wEx"
  level:
    root: INFO
    com.earth.online.player.ailearn: INFO
    # 禁用 JDK HttpClient 内部分块调试日志，避免流式响应刷屏。
    jdk.internal.httpclient: OFF
    jdk.internal.httpclient.debug: OFF
